name: CI

on:
  push:
    paths-ignore:
      - "**/README.md"
      - "LICENSE.txt"
      - ".gitignore"
    branches:
      - master
  pull_request:
    paths-ignore:
      - "**/README.md"
      - "LICENSE.txt"
      - ".gitignore"
    branches:
      - master
  release:
    types: [created]  # triggers on new tagged release creation

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Cache for ccache, downloaded packages, etc.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/CMake
            ~/.ccache
            ~/.nuget/packages
          key: ${{ runner.os }}-cmake-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-

      # On Linux, install build essentials: Ninja + ccache
      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      # On Windows, ensure MSVC is in PATH
      - name: Setup MSVC environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build with CMake
        run: cmake --build build --parallel

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.os }}-build-artifacts"
          path: build/
          retention-days: 7

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: build_artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
